import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'dev.frozenmilk.sinister.sloth.load'
}

android {
    compileSdk 35
    namespace = 'com.qualcomm.ftcrobotcontroller'

    signingConfigs {
        release {
            def apkStoreFile = System.getenv("APK_SIGNING_STORE_FILE")
            if (apkStoreFile != null) {
                keyAlias System.getenv("APK_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("APK_SIGNING_KEY_PASSWORD")
                storeFile file(System.getenv("APK_SIGNING_STORE_FILE"))
                storePassword System.getenv("APK_SIGNING_STORE_PASSWORD")
            } else {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file('libs/ftc.debug.keystore')
                storePassword 'android'
            }
        }
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('libs/ftc.debug.keystore')
            storePassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.qualcomm.ftcrobotcontroller'
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 63
        versionName "12.0"
        buildConfigField "String", "APP_BUILD_TIME", '"' + (new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ", Locale.ROOT).format(new Date())) + '"'
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            ndk { abiFilters "arm64-v8a" }
        }
        debug {
            jniDebuggable true
            ndk { abiFilters "arm64-v8a" }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        pickFirst '**/*.so'
        jniLibs.useLegacyPackaging = true
    }

    ndkVersion = '21.3.6528147'
}

configurations.configureEach {
    exclude group: 'com.acmerobotics.dashboard'
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:tuning:1.0.1'
    implementation 'com.pedropathing.ivy:pedro:1.1.1'

    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'
    // 6165 slothboard build from TeamCode/libs/m2; the version prefix must match the Sloth version.
    implementation 'com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0-6165.4'
}

// limelight/'s ball pipeline and SnapScript as Java constants, so deploySloth carries them as well as Run.
abstract class GenerateLimelightFiles extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getScriptFile()

    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getPipelineFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        File scriptFile = getScriptFile().get().asFile
        File pipelineFile = getPipelineFile().get().asFile
        String script = scriptFile.getText('UTF-8').replace('\r\n', '\n')
        String pipeline = pipelineFile.getText('UTF-8').replace('\r\n', '\n').trim()
        def type = new groovy.json.JsonSlurper().parseText(pipeline).pipeline_type
        if (type != 'pipe_python') throw new GradleException("$pipelineFile is a $type pipeline, not pipe_python")
        def ids = script =~ /(?m)^SCRIPT_ID = (\d+)\.0$/
        if (ids.count != 1) throw new GradleException("$scriptFile needs exactly one 'SCRIPT_ID = <integer>.0' line")
        long fileId = ids[0][1] as long

        def crc = new java.util.zip.CRC32()
        crc.update((script + '\u0000' + pipeline).getBytes('UTF-8'))
        // llpython reaches the hub as 32-bit floats, which hold integers exactly only below 2^24.
        long stamp = 0x800000L | (crc.value & 0x7FFFFFL)
        String uploaded = script.replaceFirst(/(?m)^SCRIPT_ID = \d+\.0$/,
                "SCRIPT_ID = ${stamp}.0  # the robot's upload stamp; limelight/${scriptFile.name} says ${fileId}")

        File dir = getOutputDir().get().asFile
        dir.deleteDir()
        File out = new File(dir, 'org/firstinspires/ftc/teamcode/modules/vision/LimelightFiles.java')
        out.parentFile.mkdirs()
        out.setText("""package org.firstinspires.ftc.teamcode.modules.vision;

// Generated by TeamCode/build.gradle from limelight/${pipelineFile.name} and limelight/${scriptFile.name}.
final class LimelightFiles {
    static final String BALL_PIPELINE = ${javaString(pipeline)};
    static final String BALL_SCRIPT = ${javaString(uploaded)};
    static final double BALL_SCRIPT_ID = ${fileId};
    static final double BALL_SCRIPT_STAMP = ${stamp};

    private LimelightFiles() {}
}
""", 'UTF-8')
    }

    private static String javaString(String s) {
        StringBuilder b = new StringBuilder('"')
        for (char ch : s.toCharArray()) {
            int c = (int) ch
            if (c == 0x22) b.append('\\"')
            else if (c == 0x5C) b.append('\\\\')
            else if (c == 0x0A) b.append('\\n')
            else if (c == 0x0D) b.append('\\r')
            else if (c == 0x09) b.append('\\t')
            else if (c < 0x20 || c > 0x7E) b.append(String.format('\\u%04x', c))
            else b.append(ch)
        }
        return b.append('"').toString()
    }
}

def generateLimelightFiles = tasks.register('generateLimelightFiles', GenerateLimelightFiles) { t ->
    t.scriptFile.set(rootProject.layout.projectDirectory.file('limelight/ball_contour_snapscript.py'))
    t.pipelineFile.set(rootProject.layout.projectDirectory.file('limelight/ball_pipeline.vpr'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generateLimelightFiles) { it.outputDir }
    }
}
