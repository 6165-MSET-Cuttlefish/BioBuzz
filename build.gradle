plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'dev.frozenmilk.sinister.sloth.load' version '0.3.2' apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
        // Sloth runtime and its Sinister dependency.
        maven { url = 'https://repo.dairy.foundation/releases' }
        // 6165's slothboard build (Dairy tag + team PRs), committed under TeamCode/libs/m2.
        maven {
            url = "${rootDir}/TeamCode/libs/m2"
            content { includeGroup 'com.acmerobotics.slothboard' }
        }
    }
}
